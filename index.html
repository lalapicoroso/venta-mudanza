<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venta x mudanza</title>
<meta name="description" content="Catálogo de cosas de casa en venta por mudanza.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f2f2f2;
    --line: #e6e6e6;
    --text: #161616;
    --muted: #6b6b6b;
    --accent: #ff385c;
    --accent-ink: #ffffff;
    --amber: #f5b83d;
    --radius: 16px;
    --shadow: 0 6px 20px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45; min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  header.wrap { padding-top: 56px; padding-bottom: 28px; }
  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; margin-bottom: 20px;
  }
  .tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  h1 { font-size: clamp(40px, 7.5vw, 72px); font-weight: 800; letter-spacing: -0.035em; line-height: 0.98; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { color: var(--muted); font-size: 18px; max-width: 560px; margin-top: 16px; }

  .filters {
    position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .filters .wrap { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; align-items: center; }
  .filters .wrap::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    padding: 9px 16px; border-radius: 99px; transition: .15s;
  }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
  .toggle { margin-left: auto; flex: none; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; padding-left: 12px; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

  .grid {
    display: grid; gap: 32px 24px; padding: 28px 0 80px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  .card {
    background: none; border: none; border-radius: var(--radius);
    display: flex; flex-direction: column; cursor: pointer; transition: .2s;
    text-align: left; font: inherit; color: inherit; padding: 0;
  }
  .card:hover .thumb { box-shadow: var(--shadow); }
  .card:hover .thumb img:not(.fill), .card:hover .ph { transform: scale(1.03); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { aspect-ratio: 4 / 5; background: #f4f4f4; position: relative; overflow: hidden; border-radius: var(--radius); transition: .2s; }
  .thumb img, .ph { transition: transform .3s; }
  .thumb img { position: relative; width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb img.fill { position: absolute; inset: 0; object-fit: cover; filter: blur(22px) saturate(1.1); transform: scale(1.2); opacity: .55; }
  .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: 56px; font-weight: 700; color: #d4d4d4; font-weight: 800; letter-spacing: -0.04em; }
  .badge {
    position: absolute; top: 12px; left: 12px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; padding: 5px 10px; border-radius: 99px;
  }
  .badge.reservado { background: #fff; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .badge.vendido { background: var(--text); color: #fff; }
  .card.vendido .thumb img, .card.vendido .ph { filter: grayscale(.8) opacity(.55); }
  .count { position: absolute; bottom: 10px; right: 10px; font-size: 12px; background: rgba(0,0,0,.65); color: #fff; padding: 3px 8px; border-radius: 99px; }
  .body { padding: 12px 2px 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .cat { font-size: 13px; color: var(--muted); }
  .name { font-size: 16px; font-weight: 600; }
  .price { font-size: 18px; font-weight: 800; margin-top: auto; padding-top: 4px; color: var(--text); }
  .card.vendido .price { color: var(--muted); text-decoration: line-through; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }

  /* Detalle a pantalla completa */
  body.viendo-detalle > header, body.viendo-detalle > nav, body.viendo-detalle > main, body.viendo-detalle > footer { display: none; }
  #detalle { display: none; min-height: 100svh; }
  body.viendo-detalle #detalle { display: block; }
  .topbar {
    position: sticky; top: 0; z-index: 10; height: 60px; display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .back {
    display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 600; font-size: 15px;
    background: none; border: none; color: var(--text); cursor: pointer; padding: 8px 10px 8px 0;
  }
  .back svg { width: 20px; height: 20px; }
  .share { font: inherit; font-size: 14px; font-weight: 600; background: none; border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; cursor: pointer; color: var(--text); }

  .detail { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 40px; padding: 24px 0 60px; align-items: start; }
  .gallery { position: sticky; top: 84px; }
  .stage { position: relative; }
  .slides {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    background: var(--surface-2); border-radius: var(--radius); height: calc(100svh - 200px); min-height: 360px;
  }
  .slides::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: center; display: grid; place-items: center; }
  .slide img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; display: block; }
  .gnav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: none; background: #fff; box-shadow: var(--shadow); font-size: 20px; cursor: pointer; color: var(--text); }
  .gnav.prev { left: 14px; } .gnav.next { right: 14px; }
  .gnav[disabled] { opacity: 0; pointer-events: none; }
  .counter { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 600; background: rgba(0,0,0,.65); color: #fff; padding: 4px 10px; border-radius: 99px; }
  .thumbs { display: flex; gap: 8px; padding-top: 12px; overflow-x: auto; scrollbar-width: none; }
  .thumbs button { flex: none; width: 64px; height: 64px; padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--surface-2); opacity: .55; transition: .15s; }
  .thumbs button[aria-current="true"] { border-color: var(--text); opacity: 1; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .info { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
  .info h2 { font-size: clamp(28px, 4vw, 40px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 800; }
  .info .price { font-size: 28px; padding: 0; margin: 0; }
  .info p { color: #3d3d3d; font-size: 17px; line-height: 1.6; }
  .cta-wrap { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .cta {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 700; font-size: 17px;
    padding: 17px 20px; border-radius: 14px; transition: .15s;
  }
  .cta:hover { filter: brightness(1.1); }
  .cta.off { background: var(--surface-2); color: var(--muted); pointer-events: none; }
  .note { font-size: 13px; color: var(--muted); text-align: center; }

  @media (max-width: 800px) {
    .detail { grid-template-columns: 1fr; gap: 20px; padding: 0 0 120px; }
    #detalle .detail.wrap { padding: 0; }
    .gallery { position: relative; top: 0; }
    .slides { border-radius: 0; height: 60svh; min-height: 0; }
    .gnav, .thumbs { display: none; }
    .info { padding: 0 20px; }
    .cta-wrap {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; margin: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.96);
      backdrop-filter: blur(10px); border-top: 1px solid var(--line);
    }
    .cta-wrap .note { display: none; }
  }

  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>

<header class="wrap">
  <div class="tag" id="stock"></div>
  <h1 id="titulo"></h1>
  <p class="sub" id="subtitulo"></p>
</header>

<nav class="filters" aria-label="Filtrar por categoría">
  <div class="wrap" id="chips"></div>
</nav>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="wrap">¿Dudas o querés ofertar por varias cosas juntas? <a id="wa-general" target="_blank" rel="noopener">Escribime por WhatsApp</a>.</div>
</footer>

<section id="detalle" aria-labelledby="d-title">
  <div class="topbar">
    <div class="wrap">
      <button class="back" id="volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Volver</button>
      <button class="share" id="compartir">Compartir</button>
    </div>
  </div>
  <div class="detail wrap" id="detail"></div>
</section>

<script>
  // Carga productos.js sin caché, así los cambios se ven al instante
  document.write('<script src="productos.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
  // Tema: color de acento definido en productos.js (o ?accent= para previsualizar)
  (() => {
    const q = new URLSearchParams(location.search), r = document.documentElement.style;
    const a = q.get("accent") || window.CONFIG.acento, ink = q.get("ink") || window.CONFIG.acentoTexto;
    if (a) r.setProperty("--accent", a.startsWith("#") ? a : "#" + a);
    if (ink) r.setProperty("--accent-ink", ink.startsWith("#") ? ink : "#" + ink);
  })();
</script>
<script>
  const C = window.CONFIG, P = window.PRODUCTOS;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => n == null || n === "" ? "Consultar precio" : C.moneda + Number(n).toLocaleString("es-AR");
  const wa = (msg) => `https://wa.me/${C.whatsapp}?text=${encodeURIComponent(msg)}`;
  const initials = (s) => s.split(/\s+/).filter((w) => /^\p{L}/u.test(w)).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  const orden = { disponible: 0, reservado: 1, vendido: 2 };

  // Encabezado
  document.title = C.titulo;
  const [first, ...rest] = C.titulo.split(" ");
  $("titulo").innerHTML = `${esc(first)} <em>${esc(rest.join(" "))}</em>`;
  $("subtitulo").textContent = C.subtitulo;
  const disp = P.filter((p) => p.estado === "disponible").length;
  $("stock").textContent = `${disp} ${disp === 1 ? "cosa disponible" : "cosas disponibles"}`;
  $("wa-general").href = wa("¡Hola! Vi tu catálogo de venta por mudanza y tengo una consulta.");

  // Filtros
  let cat = "Todo", ocultarVendidos = false;
  const cats = ["Todo", ...new Set(P.map((p) => p.categoria))];
  $("chips").innerHTML = cats.map((c) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("") +
    `<label class="toggle"><input type="checkbox" id="hide"> Ocultar vendidos</label>`;
  $("chips").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    cat = b.dataset.cat;
    document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x === b));
    render();
  });
  $("hide").addEventListener("change", (e) => { ocultarVendidos = e.target.checked; render(); });

  // Grilla
  function render() {
    const list = P
      .filter((p) => (cat === "Todo" || p.categoria === cat) && !(ocultarVendidos && p.estado === "vendido"))
      .sort((a, b) => orden[a.estado] - orden[b.estado]);
    $("grid").innerHTML = list.length ? list.map((p) => `
      <button class="card ${p.estado}" data-id="${esc(p.id)}">
        <div class="thumb">
          ${p.fotos?.length ? `<img class="fill" src="${esc(p.fotos[0])}" alt="" aria-hidden="true" loading="lazy"><img src="${esc(p.fotos[0])}" alt="${esc(p.nombre)}" loading="lazy">` : `<div class="ph">${esc(initials(p.nombre))}</div>`}
          ${p.estado !== "disponible" ? `<span class="badge ${p.estado}">${p.estado}</span>` : ""}
          ${p.fotos?.length > 1 ? `<span class="count">${p.fotos.length} fotos</span>` : ""}
        </div>
        <div class="body">
          <span class="cat">${esc(p.categoria)}</span>
          <span class="name">${esc(p.nombre)}</span>
          <span class="price">${money(p.precio)}</span>
        </div>
      </button>`).join("") : `<p class="empty">No hay nada acá por ahora.</p>`;
  }

  // Detalle (pantalla completa, con URL propia: tusitio/#id)
  let scrollCatalogo = 0, actual = null;
  $("grid").addEventListener("click", (e) => {
    const c = e.target.closest(".card"); if (!c) return;
    scrollCatalogo = scrollY;
    location.hash = c.dataset.id;
  });
  $("volver").addEventListener("click", () => {
    if (history.state?.desdeCatalogo) history.back();
    else { history.replaceState(null, "", location.pathname); mostrar(); }
  });
  $("compartir").addEventListener("click", async () => {
    const url = location.href, title = actual?.nombre || C.titulo;
    try {
      if (navigator.share) await navigator.share({ title, url });
      else { await navigator.clipboard.writeText(url); $("compartir").textContent = "¡Link copiado!"; setTimeout(() => ($("compartir").textContent = "Compartir"), 1800); }
    } catch {}
  });

  function detalle(p) {
    const fotos = p.fotos || [];
    const msg = `¡Hola! Me interesa "${p.nombre}"${p.precio == null ? "" : ` (${money(p.precio)})`} de tu venta por mudanza. ¿Sigue disponible?`;
    const cta = {
      disponible: `<a class="cta" href="${wa(msg)}" target="_blank" rel="noopener">Me interesa → WhatsApp</a><span class="note">Se abre WhatsApp con un mensaje ya escrito.</span>`,
      reservado: `<a class="cta" href="${wa(msg.replace("¿Sigue disponible?", "Si se cae la reserva, ¿me avisás?"))}" target="_blank" rel="noopener">Avisame si se libera</a><span class="note">Está reservado, pero podés quedar en lista de espera.</span>`,
      vendido: `<span class="cta off">Vendido</span>`,
    }[p.estado];
    $("detail").innerHTML = `
      <div class="gallery">
        <div class="stage">
        <div class="slides" id="slides">
          ${fotos.length ? fotos.map((f, i) => `<div class="slide"><img src="${esc(f)}" alt="${esc(p.nombre)} – foto ${i + 1}" ${i ? 'loading="lazy"' : ""}></div>`).join("")
            : `<div class="slide"><div class="ph">${esc(initials(p.nombre))}</div></div>`}
        </div>
        ${fotos.length > 1 ? `
          <button class="gnav prev" aria-label="Foto anterior">‹</button>
          <button class="gnav next" aria-label="Foto siguiente">›</button>
          <span class="counter" id="counter">1 / ${fotos.length}</span>` : ""}
        </div>
        ${fotos.length > 1 ? `<div class="thumbs">${fotos.map((f, i) => `<button data-i="${i}" aria-current="${i === 0}" aria-label="Ver foto ${i + 1}"><img src="${esc(f)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
      </div>
      <div class="info">
        <span class="cat">${esc(p.categoria)}${p.estado !== "disponible" ? ` · <span style="color:var(--accent);font-weight:600">${p.estado}</span>` : ""}</span>
        <h2 id="d-title">${esc(p.nombre)}</h2>
        <span class="price">${money(p.precio)}</span>
        <p>${esc(p.descripcion)}</p>
        <div class="cta-wrap">${cta}</div>
      </div>`;

    if (fotos.length < 2) return;
    const slides = $("slides"), n = fotos.length;
    const prev = $("detail").querySelector(".prev"), next = $("detail").querySelector(".next");
    const ir = (i) => slides.scrollTo({ left: i * slides.clientWidth, behavior: "smooth" });
    const idx = () => Math.round(slides.scrollLeft / (slides.clientWidth || 1));
    const sync = () => {
      const i = idx();
      $("counter").textContent = `${i + 1} / ${n}`;
      prev.disabled = i === 0; next.disabled = i === n - 1;
      $("detail").querySelectorAll(".thumbs button").forEach((b) => b.setAttribute("aria-current", +b.dataset.i === i));
    };
    slides.addEventListener("scroll", () => requestAnimationFrame(sync), { passive: true });
    prev.addEventListener("click", () => ir(idx() - 1));
    next.addEventListener("click", () => ir(idx() + 1));
    $("detail").querySelectorAll(".thumbs button").forEach((b) => b.addEventListener("click", () => ir(+b.dataset.i)));
    requestAnimationFrame(sync);
  }

  function mostrar() {
    const id = decodeURIComponent(location.hash.slice(1));
    const p = id && P.find((x) => x.id === id);
    if (p) {
      if (!history.state) history.replaceState({ desdeCatalogo: scrollCatalogo > 0 || document.body.dataset.listo === "1" }, "");
      actual = p;
      detalle(p);
      document.body.classList.add("viendo-detalle");
      document.title = `${p.nombre} · ${C.titulo}`;
      scrollTo(0, 0);
    } else {
      actual = null;
      document.body.classList.remove("viendo-detalle");
      document.title = C.titulo;
      scrollTo(0, scrollCatalogo);
    }
  }
  addEventListener("hashchange", mostrar);
  addEventListener("keydown", (e) => { if (e.key === "Escape" && actual) $("volver").click(); });

  render();
  mostrar();
  document.body.dataset.listo = "1";
</script>
</body>
</html>
